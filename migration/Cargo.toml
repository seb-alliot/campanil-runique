[package]
edition      = "2024"
name         = "campanile-migration"
publish      = false
rust-version = "1.94"
version      = "0.1.0"

[lib]
name = "campanile_migration"
path = "src/lib.rs"

[[bin]]
name = "campanile-migration"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }
runique = { version = "4.0.0", features = ["postgres"] }

[dependencies.sea-orm-migration]
version = "2.0.4"
features = ["runtime-tokio-rustls", "sqlx-postgres"]
